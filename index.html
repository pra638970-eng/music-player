<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Melodify | Modern Web Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0b1120 0%, #19233c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }
        .player-container {
            max-width: 500px;
            width: 100%;
            background: rgba(20, 28, 44, 0.75);
            backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08);
            padding: 1.8rem 1.8rem 2.2rem;
            transition: all 0.2s ease;
        
        .cover-area {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
        }

        .cover-image {
            width: 180px;
            height: 180px;
            background: linear-gradient(145deg, #2a3650, #101624);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .cover-image svg {
            width: 80px;
            height: 80px;
            opacity: 0.7;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .song-info {
            text-align: center;
            margin-bottom: 1.6rem;
        }

        .song-title {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #F9Faff, #cbd5ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }

        .song-artist {
            font-size: 0.95rem;
            color: #9aa7c7;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .progress-section {
            margin: 1rem 0 1.3rem;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 500;
            color: #b7c3e6;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            height: 6px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }

        .progress-fill {
            background: linear-gradient(90deg, #7b8eff, #b2baff);
            width: 0%;
            height: 6px;
            border-radius: 40px;
            position: relative;
            transition: width 0.05s linear;
            box-shadow: 0 0 6px #7b8eff;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.7rem;
            margin: 2rem 0 1.8rem;
        }

        .ctrl-btn {
            background: rgba(20, 28, 44, 0.8);
            border: none;
            width: 58px;
            height: 58px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .ctrl-btn svg {
            width: 26px;
            height: 26px;
            stroke: #f0f3ff;
            stroke-width: 1.8;
            fill: none;
        }

        .ctrl-btn.play-btn svg {
            fill: #f0f3ff;
            stroke: none;
        }

        .ctrl-btn:active {
            transform: scale(0.94);
            background: #2e3b5c;
        }

        .ctrl-btn:hover {
            background: #2c385a;
            cursor: pointer;
        }

        .extra-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.7rem;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 60px;
            width: fit-content;
        }

        .volume-icon svg {
            width: 18px;
            height: 18px;
            stroke: #cdd9ff;
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            background: #3f4a6b;
            border-radius: 5px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #ccd6ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px white;
        }

        .playlist-toggle, .loop-mode {
            background: rgba(0, 0, 0, 0.35);
            border: none;
            padding: 6px 14px;
            border-radius: 60px;
            color: #d3deff;
            font-weight: 500;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.1s;
            backdrop-filter: blur(4px);
        }

        .loop-mode.active {
            background: #5d72e6;
            color: white;
            box-shadow: 0 0 6px #5d72e6;
        }
        .playlist-panel {
            background: rgba(12, 18, 30, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            margin-top: 1.5rem;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .playlist-panel.open {
            max-height: 320px;
            padding: 0.9rem 0.6rem;
            overflow-y: auto;
        }

        .playlist-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #a8b8ec;
            margin: 0 0 10px 8px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin: 4px 8px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.03);
            transition: 0.1s;
            cursor: pointer;
        }

        .playlist-item.active-song {
            background: #3a4780;
            box-shadow: 0 0 4px #7b8eff;
        }

        .playlist-item:hover {
            background: #2d3860;
        }

        .playlist-item .track-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: #eef3ff;
        }

        .playlist-item .track-artist-sm {
            font-size: 0.7rem;
            color: #9babe0;
        }
        .playlist-panel::-webkit-scrollbar {
            width: 4px;
        }

        .playlist-panel::-webkit-scrollbar-track {
            background: #1e263e;
            border-radius: 10px;
        }

        .playlist-panel::-webkit-scrollbar-thumb {
            background: #5d72e6;
            border-radius: 10px;
        }

        @media (max-width: 500px) {
            .player-container {
                padding: 1.3rem;
            }
            .ctrl-btn {
                width: 52px;
                height: 52px;
            }
            .cover-image {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="cover-area">
        <div class="cover-image" id="coverArt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <path d="M9 18V5l12-2v13" stroke="#b3c7ff" fill="#b3c7ff20"/>
                <circle cx="6" cy="18" r="3" stroke="#b3c7ff" fill="#1e293b"/>
                <circle cx="18" cy="16" r="3" stroke="#b3c7ff" fill="#1e293b"/>
                <path d="M9 10l12-2" stroke="#b3c7ff"/>
            </svg>
        </div>
    </div>

    <div class="song-info">
        <div class="song-title" id="songTitle">Midnight Echoes</div>
        <div class="song-artist" id="songArtist">Luna Wave</div>
    </div>

    <div class="progress-section">
        <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="durationTime">0:00</span>
        </div>
        <div class="progress-bar-bg" id="progressBarBg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
    <div class="controls">
        <button class="ctrl-btn" id="prevBtn">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <polygon points="19 20 9 12 19 4 19 20" fill="none"/>
                <rect x="5" y="4" width="2" height="16" fill="currentColor" stroke="none"/>
            </svg>
        </button>
        <button class="ctrl-btn play-btn" id="playPauseBtn">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
        <button class="ctrl-btn" id="nextBtn">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <polygon points="5 4 15 12 5 20 5 4" fill="none"/>
                <rect x="17" y="4" width="2" height="16" fill="currentColor" stroke="none"/>
            </svg>
        </button>
    </div>

    <div class="extra-controls">
        <div class="volume-wrap">
            <div class="volume-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3z M16.5 8.5A5 5 0 0 1 16.5 15.5"/>
                </svg>
            </div>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
        <button class="loop-mode" id="loopBtn">🔁 Loop</button>
        <button class="playlist-toggle" id="togglePlaylistBtn">📋 Playlist</button>
    </div>
    <div class="playlist-panel" id="playlistPanel">
        <div class="playlist-title">🎵 Current queue</div>
        <div id="playlistItemsContainer"></div>
    </div>
</div>

<script>
    const songs = [
        { title: "Midnight Echoes", artist: "Luna Wave", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", coverHint: "🎧" },
        { title: "Neon Dreams", artist: "Kaela Drift", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", coverHint: "✨" },
        { title: "Aurora Borealis", artist: "Northern Lights Project", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", coverHint: "🌌" },
        { title: "Silent Waves", artist: "Ocean Echo", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", coverHint: "🌊" },
        { title: "Urban Sunrise", artist: "Metro Pulse", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", coverHint: "🏙️" }
    ];

    const audio = new Audio();
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const progressBg = document.getElementById('progressBarBg');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('durationTime');
    const songTitleEl = document.getElementById('songTitle');
    const songArtistEl = document.getElementById('songArtist');
    const volumeSlider = document.getElementById('volumeSlider');
    const loopBtn = document.getElementById('loopBtn');
    const togglePlaylistBtn = document.getElementById('togglePlaylistBtn');
    const playlistPanel = document.getElementById('playlistPanel');
    const playlistContainer = document.getElementById('playlistItemsContainer');

    let currentTrackIndex = 0;
    let isPlaying = false;
    let isLoop = false;     
    let isUpdatingProgress = false;

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function loadTrack(index) {
        const track = songs[index];
        if (!track) return;
        audio.src = track.src;
        songTitleEl.textContent = track.title;
        songArtistEl.textContent = track.artist;

        const coverSvg = document.querySelector('#coverArt svg');
        if (coverSvg) {
            let colorVal = index % 2 === 0 ? '#b3c7ff' : '#ffb7c5';
            coverSvg.setAttribute('stroke', colorVal);
        }
        progressFill.style.width = '0%';
        currentTimeSpan.textContent = '0:00';
        if (audio.duration && !isNaN(audio.duration)) {
            durationSpan.textContent = formatTime(audio.duration);
        } else {
            durationSpan.textContent = '0:00';
        }
    
        if (isPlaying) {
            audio.play().catch(e => console.log("autoplay blocked, user interaction needed", e));
        }
        updateActivePlaylistHighlight();
    }

    function updateActivePlaylistHighlight() {
        const items = document.querySelectorAll('.playlist-item');
        items.forEach((item, idx) => {
            if (idx === currentTrackIndex) {
                item.classList.add('active-song');
            } else {
                item.classList.remove('active-song');
            }
        });
    }

    function renderPlaylist() {
        playlistContainer.innerHTML = '';
        songs.forEach((song, idx) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'playlist-item';
            if (idx === currentTrackIndex) itemDiv.classList.add('active-song');
            itemDiv.innerHTML = `
                <div>
                    <div class="track-name">${song.title}</div>
                    <div class="track-artist-sm">${song.artist}</div>
                </div>
                <span style="font-size:12px;">🎵</span>
            `;
            itemDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentTrackIndex === idx && isPlaying) {
                    audio.currentTime = 0;
                    if (!isPlaying) audio.play().catch(e=>null);
                } else {
                    currentTrackIndex = idx;
                    loadTrack(currentTrackIndex);
                    if (isPlaying) {
                        audio.play().catch(e => console.log("autoplay"));
                    } else {
                    }
                }
                updatePlayPauseIcon();
                isPlaying = !audio.paused;
                updatePlayPauseIcon();
            });
            playlistContainer.appendChild(itemDiv);
        });
    }

    function togglePlayPause() {
        if (isPlaying) {
            audio.pause();
        } else {
            audio.play().catch(err => {
                console.warn("Playback error: ", err);
                isPlaying = false;
                updatePlayPauseIcon();
            });
        }
        isPlaying = !isPlaying;
        updatePlayPauseIcon();
    }

    function updatePlayPauseIcon() {
        const playIconSvg = document.getElementById('playIcon');
        if (!playIconSvg) return;
        if (isPlaying) {
 
            playIconSvg.innerHTML = `<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>`;
        } else {
            playIconSvg.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        }
    }

    function nextSong() {
        const newIndex = (currentTrackIndex + 1) % songs.length;
        currentTrackIndex = newIndex;
        loadTrack(currentTrackIndex);
        if (isPlaying) {
            audio.play().catch(e => console.log(e));
        }
        updatePlayPauseIcon();
    }

  
    function prevSong() {
        const newIndex = (currentTrackIndex - 1 + songs.length) % songs.length;
        currentTrackIndex = newIndex;
        loadTrack(currentTrackIndex);
        if (isPlaying) {
            audio.play().catch(e => console.log(e));
        }
        updatePlayPauseIcon();
    }

    function updateProgress() {
        if (!audio.duration || isNaN(audio.duration)) return;
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeSpan.textContent = formatTime(audio.currentTime);
        durationSpan.textContent = formatTime(audio.duration);
    }

    function seek(e) {
        const rect = progressBg.getBoundingClientRect();
        let clickX = e.clientX - rect.left;
        let width = rect.width;
        if (width <= 0) return;
        let seekPercent = clickX / width;
        if (seekPercent < 0) seekPercent = 0;
        if (seekPercent > 1) seekPercent = 1;
        if (audio.duration && !isNaN(audio.duration)) {
            audio.currentTime = seekPercent * audio.duration;
        }
    }

    function setVolume() {
        audio.volume = volumeSlider.value;
    }


    function toggleLoop() {
        isLoop = !isLoop;
        if (isLoop) {
            loopBtn.classList.add('active');
            loopBtn.innerHTML = '🔂 Loop 1';
        } else {
            loopBtn.classList.remove('active');
            loopBtn.innerHTML = '🔁 Loop';
        }
        audio.loop = isLoop; 
    }

    function onSongEnd() {
        if (isLoop) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log(e));
            isPlaying = true;
            updatePlayPauseIcon();
        } else {

            nextSong();
        }
    }

    function togglePlaylistDrawer() {
        playlistPanel.classList.toggle('open');
    }

    function onLoadedMetadata() {
        durationSpan.textContent = formatTime(audio.duration);
        updateProgress();
    }
    function bindEvents() {
        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        progressBg.addEventListener('click', seek);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', onLoadedMetadata);
        audio.addEventListener('ended', onSongEnd);
        volumeSlider.addEventListener('input', setVolume);
        loopBtn.addEventListener('click', toggleLoop);
        togglePlaylistBtn.addEventListener('click', togglePlaylistDrawer);
        audio.addEventListener('play', () => {
            isPlaying = true;
            updatePlayPauseIcon();
        });
        audio.addEventListener('pause', () => {
            isPlaying = false;
            updatePlayPauseIcon();
        });
        audio.addEventListener('error', (e) => {
            console.warn("Audio error", e);
        });
    }

    function init() {
        bindEvents();
        renderPlaylist();
        audio.volume = volumeSlider.value;
        audio.loop = false;
        currentTrackIndex = 0;
        loadTrack(0);
        isPlaying = false;
        updatePlayPauseIcon();

        playlistPanel.classList.remove('open');
    }

    init();
</script>
</body>
</html>
